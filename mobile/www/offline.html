<!doctype html>
<html lang="rw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoniMobi — nta murandasi</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6f3; color: #20302b; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
    h1 { color: #153f35; }
    button { background: #153f35; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 1rem; }
  </style>
</head>
<body>
  <div>
    <h1>Nta murandasi (internet)</h1>
    <p>MoniMobi ntishoboye guhuza na server. Reba niba ufite internet, hanyuma wongere ugerageze. Iyo server yari isinziriye, ishobora gufata ikiminota kugira ngo ikanguke.</p>
    <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Ongera ugerageze</button>
  </div>
</body>
</html>
